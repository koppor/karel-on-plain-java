name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write   # Vale review comments on pull requests
  checks: write          # Vale check annotations on pushes

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - name: Compile engine
        run: |
          mkdir -p out
          javac -Xlint:all -Werror -d out src/karel/Karel.java
      - name: Formatting of the engine (Netflix jfmt)
        run: ./jfmt.sh --check
      - name: Run starter program headless
        run: java -Dkarel.headless=true -cp out src/FirstKarelProgram.java
      - name: Run starter program headless under a Turkish locale (dotless i)
        run: java -Duser.language=tr -Duser.country=TR -Dkarel.headless=true -cp out src/FirstKarelProgram.java
      - uses: eirikb/gg/action@71f367edd7bcd8fdee618d2172a66b668eef2e0a # main, 2026-10-27
      - name: Requirements tracing (OpenFastTrace)
        run: gg.cmd gh/itsallcode/openfasttrace trace docs src

  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: markdownlint
        run: npm run lint:md
      - name: typos
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
      - name: Vale (Microsoft and write-good styles)
        uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          # prose only: docs/requirements.md is a specification full of ids (req~…~1, impl)
          files: '["README.md", "CONTRIBUTING.md", "CHANGELOG.md", "AGENTS.md"]'
          reporter: ${{ github.event_name == 'pull_request' && 'github-pr-review' || 'github-check' }}
          filter_mode: nofilter
          fail_on_error: true
      - name: textlint (terminology, write-good)
        run: npm run lint:text
      - name: heylogs (CHANGELOG follows Keep a Changelog)
        uses: jbangdev/jbang-action@03f9f9f6881262b315ec6b6c7d02d8af52ac889a # v0.142.0
        with:
          script: com.github.nbbrd.heylogs:heylogs-cli:0.19.1:bin
          scriptargs: check CHANGELOG.md
