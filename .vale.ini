StylesPath = .vale/styles
# warnings and errors only; the suggestion level of these packages (E-Prime, "simplify") is noise for a README
MinAlertLevel = warning
Packages = Microsoft, write-good
Vocab = Karel

[*.md]
BasedOnStyles = Vale, Microsoft, write-good
# sentence-case headings with code in them
Microsoft.Headings = NO
# "[1.3.1] – 2026-10-28" with a spaced en dash is the Keep a Changelog format
Microsoft.Dashes = NO
# Microsoft.Terms wants "personal digital assistant" for "agent"
Microsoft.Terms = NO
# "is" and "are" are fine
write-good.E-Prime = NO
# we write "cannot" and "does not" on purpose; "click" is the right verb for the mouse; punctuation outside quotes (British);
# "1, 2, 3, ... 9" is content
Microsoft.Contractions = NO
Microsoft.UIVerbs = NO
Microsoft.Quotes = NO
Microsoft.Ellipses = NO

[AGENTS.md]
# terse instructions for agent sessions, not prose
BasedOnStyles = Vale
